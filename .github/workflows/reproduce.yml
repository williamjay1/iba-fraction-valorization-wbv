name: Reproduce numerical analyses
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical-reproduction:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 src/reproduce.py --workdir temp/ci_reproduction
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: numerical-reproduction-report
          path: |
            temp/ci_reproduction/reproduction_report.json
            temp/ci_reproduction/results/verification/
            temp/ci_reproduction/logs/
